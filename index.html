<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071221">

<title>SubControl</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#030814;
  --panel:#0b1728;
  --panel2:#111f33;
  --line:#223752;
  --text:#f7fafc;
  --muted:#8fa3bb;
  --brand:#7567ff;
  --brand2:#9a8fff;
  --green:#2ed47a;
  --yellow:#ffb84d;
  --red:#ff6b78;
  --sidebar:250px
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

body{
  min-height:100vh;
}

.app{
  min-height:100vh;
  background:
    radial-gradient(circle at top right,#18264a55,transparent 28%),
    linear-gradient(180deg,#06101f,#030814)
}

/* =========================
   AUTH
========================= */

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 80% 10%,#5948d755,transparent 28%),
    radial-gradient(circle at 10% 80%,#172c5a55,transparent 30%),
    #030814;
}

.auth-card{
  width:min(100%,430px);
  background:#081526e8;
  border:1px solid #233a58;
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 30px 80px #0008;
  backdrop-filter:blur(20px)
}

.auth-logo{
  text-align:center;
  font-size:29px;
  font-weight:950;
  margin-bottom:6px
}

.auth-logo span{
  color:var(--brand2)
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin-bottom:24px
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#111f33;
  padding:5px;
  border-radius:14px;
  margin-bottom:20px
}

.auth-tabs button{
  border:0;
  background:transparent;
  color:#869ab2;
  padding:11px;
  border-radius:10px;
  font-weight:850
}

.auth-tabs button.on{
  color:white;
  background:#7567ff
}

.auth-field{
  margin-bottom:13px
}

.auth-field label{
  display:block;
  color:#9db0c6;
  font-size:11px;
  margin-bottom:7px
}

.auth-field input{
  width:100%;
  border:1px solid #2a4160;
  background:#0f1e32;
  color:white;
  outline:none;
  padding:14px;
  border-radius:13px
}

.auth-field input:focus{
  border-color:#7567ff
}

.auth-main-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:linear-gradient(135deg,#6356ef,#8477ff);
  color:white;
  font-weight:900;
  margin-top:5px
}

.auth-link{
  border:0;
  background:none;
  color:#aaa2ff;
  font-weight:800;
  display:block;
  margin:15px auto 0
}

.auth-msg{
  margin-top:14px;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  min-height:20px
}

.auth-msg.error{color:#ff8f99}
.auth-msg.ok{color:#72e7a7}

.hidden{display:none!important}

/* =========================
   APP
========================= */

.sidebar{display:none}

.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:#071221e8;
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:10
}

.brand{
  font-weight:950;
  font-size:23px
}

.brand i{
  font-style:normal;
  color:var(--brand2)
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center
}

.iconbtn,.langbtn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  border-radius:12px;
  height:40px;
  padding:0 12px;
  font-weight:800
}

.iconbtn{
  width:40px;
  padding:0
}

.content{
  padding:18px 16px 96px;
  max-width:1180px;
  margin:auto
}

.screen{display:none}
.screen.on{display:block}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:10px
}

.page-title h1{
  font-size:24px;
  margin:0
}

.page-title p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px
}

.hero{
  padding:24px;
  border-radius:22px;
  background:linear-gradient(135deg,#5145df,#7968ff);
  box-shadow:0 16px 40px #5547ef33
}

.hero small{color:#eae8ff}

.hero-amount{
  font-size:38px;
  font-weight:950;
  margin:6px 0 14px
}

.pills{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.pill{
  padding:6px 9px;
  border-radius:99px;
  background:#ffffff18;
  border:1px solid #ffffff25;
  font-size:11px
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:10px
}

.card h3{
  margin:0 0 12px;
  font-size:15px
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.quick button{
  background:var(--panel2);
  border:1px solid var(--line);
  color:white;
  border-radius:14px;
  padding:13px 8px;
  font-weight:850;
  font-size:12px
}

.quick b{
  display:block;
  font-size:19px;
  margin-bottom:5px
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 9px
}

.section-head h3{
  margin:0;
  font-size:16px
}

.linkbtn{
  border:0;
  background:none;
  color:var(--brand2);
  font-weight:850
}

.sub{
  display:grid;
  grid-template-columns:46px 1fr auto;
  gap:11px;
  align-items:center
}

.ico{
  width:46px;
  height:46px;
  border-radius:13px;
  background:var(--panel2);
  display:grid;
  place-items:center;
  font-size:21px
}

.name{font-weight:850}

.meta{
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
  margin-top:3px
}

.price{
  text-align:end;
  font-weight:900
}

.tag{
  display:inline-block;
  margin-top:5px;
  font-size:9px;
  padding:4px 7px;
  border-radius:99px;
  font-weight:850
}

.active{background:#17854b25;color:#68e6a0}
.paused{background:#9e681d28;color:#ffc773}
.cancelled{background:#8c263428;color:#ff929d}
.pending_cancel{background:#6b4d1738;color:#ffd27a}
.action_required{background:#3b4f8b38;color:#aebfff}

.row-actions{
  display:flex;
  gap:7px;
  margin-top:11px;
  flex-wrap:wrap
}

.ghost,.primary,.danger{
  border-radius:10px;
  padding:8px 10px;
  font-size:11px;
  font-weight:850
}

.ghost{
  background:#172842;
  color:#fff;
  border:1px solid #2c4462
}

.primary{
  background:var(--brand);
  border:1px solid var(--brand);
  color:white
}

.danger{
  background:#5b1d2a;
  color:#ffabb3;
  border:1px solid #833040
}

.search{
  width:100%;
  padding:13px 14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  color:white;
  outline:none;
  margin:5px 0 12px
}

.metricgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.metric{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px
}

.metric small{color:var(--muted)}

.metric strong{
  display:block;
  font-size:22px;
  margin-top:4px
}

.detect{
  background:linear-gradient(135deg,#14243a,#0c1726);
  border:1px solid #2b4362;
  border-radius:18px;
  padding:15px
}

.detect-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.switch{
  width:48px;
  height:27px;
  border-radius:99px;
  background:#2b3d56;
  position:relative
}

.switch i{
  position:absolute;
  width:21px;
  height:21px;
  background:white;
  border-radius:50%;
  top:3px;
  inset-inline-start:3px;
  transition:.2s
}

.switch.on{background:var(--brand)}

.switch.on i{
  inset-inline-start:24px
}

.detect-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}

.detect-actions button{
  padding:11px;
  border-radius:11px;
  background:#1a2a42;
  border:1px solid #2c4462;
  color:white;
  font-weight:850
}

.total{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:17px 0
}

.total strong{font-size:30px}

.methods{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.method{
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:#000;
  font-weight:900
}

.method.dark{
  background:#182943;
  color:#fff
}

.notice{
  font-size:10px;
  line-height:1.6;
  color:var(--muted);
  margin-top:10px
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line)
}

.profile-row:last-child{border-bottom:0}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 8px
}

.bottomnav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#071221f4;
  border-top:1px solid var(--line);
  backdrop-filter:blur(15px);
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:12
}

.bottomnav button{
  border:0;
  background:none;
  color:#73859d;
  font-size:10px
}

.bottomnav strong{
  display:block;
  font-size:17px;
  margin-bottom:3px
}

.bottomnav .on{color:var(--brand2)}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:30
}

.modal.on{display:flex}

.sheet{
  width:min(100%,620px);
  max-height:90vh;
  overflow:auto;
  background:#0b1728;
  border:1px solid #263c58;
  border-radius:24px 24px 0 0;
  padding:18px 16px 24px
}

.sheet h2{
  margin:0 0 14px;
  font-size:19px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.field{margin-bottom:11px}

.field label{
  display:block;
  color:#a8b7c9;
  font-size:11px;
  margin-bottom:6px
}

.field input,.field select{
  width:100%;
  background:#101f34;
  border:1px solid #2b405b;
  color:white;
  border-radius:12px;
  padding:12px;
  outline:none
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px
}

.sheet-actions button{
  padding:12px;
  border-radius:12px;
  font-weight:850
}

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(15px);
  width:min(90%,420px);
  background:#172842;
  border:1px solid #304966;
  padding:12px 14px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
  font-size:12px
}

.toast.on{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

.user-email{
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#aebfff;
  font-size:11px
}

@media(min-width:900px){

  .app{padding-inline-start:var(--sidebar)}

  .sidebar{
    display:flex;
    position:fixed;
    inset-block:0;
    inset-inline-start:0;
    width:var(--sidebar);
    background:#071221;
    border-inline-end:1px solid var(--line);
    padding:22px 16px;
    flex-direction:column;
    z-index:20
  }

  .sidebar .brand{margin-bottom:24px}

  .side-nav{
    display:flex;
    flex-direction:column;
    gap:7px
  }

  .side-nav button{
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid transparent;
    background:none;
    color:#8ea1b8;
    border-radius:12px;
    padding:12px 13px;
    text-align:start;
    font-weight:800
  }

  .side-nav button strong{font-size:18px}

  .side-nav button.on{
    background:#161f3a;
    border-color:#2c3f65;
    color:#c8c2ff
  }

  .side-foot{
    margin-top:auto;
    color:var(--muted);
    font-size:11px;
    line-height:1.6
  }

  .topbar{padding:0 28px}
  .topbar .brand{display:none}

  .content{padding:26px 28px 40px}
  .bottomnav{display:none}

  .dashboard-grid{
    grid-template-columns:minmax(0,1.3fr) minmax(330px,.7fr);
    align-items:start
  }

  .profile-grid{grid-template-columns:1fr 1fr}
  .metricgrid{grid-template-columns:repeat(4,1fr)}

  .modal{align-items:center}
  .sheet{border-radius:22px}
  .toast{bottom:28px}
}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="auth-logo">
      SubControl <span>⚡</span>
    </div>

    <div class="auth-sub" id="authSubtitle">
      تحكم في اشتراكاتك ومدفوعاتك من مكان واحد
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="on" onclick="showLogin()">تسجيل الدخول</button>
      <button id="signupTab" onclick="showSignup()">إنشاء حساب</button>
    </div>

    <div id="loginForm">

      <div class="auth-field">
        <label>البريد الإلكتروني</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com">
      </div>

      <div class="auth-field">
        <label>كلمة المرور</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••">
      </div>

      <button class="auth-main-btn" onclick="loginUser()">
        تسجيل الدخول
      </button>

      <button class="auth-link" onclick="forgotPassword()">
        نسيت كلمة المرور؟
      </button>

    </div>

    <div id="signupForm" class="hidden">

      <div class="auth-field">
        <label>الاسم</label>
        <input
          id="signupName"
          type="text"
          autocomplete="name"
          placeholder="الاسم">
      </div>

      <div class="auth-field">
        <label>البريد الإلكتروني</label>
        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com">
      </div>

      <div class="auth-field">
        <label>كلمة المرور</label>
        <input
          id="signupPassword"
          type="password"
          autocomplete="new-password"
          placeholder="8 أحرف أو أكثر">
      </div>

      <button class="auth-main-btn" onclick="signupUser()">
        إنشاء الحساب
      </button>

    </div>

    <div id="authMessage" class="auth-msg"></div>

  </div>

</section>

<!-- =========================
     MAIN APP
========================= -->

<div id="mainApp" class="app hidden">

<aside class="sidebar">

  <div class="brand">
    SubControl <i>⚡</i>
  </div>

  <nav class="side-nav" id="sideNav"></nav>

  <div class="side-foot">
    منصة واحدة لإدارة الاشتراكات على الجوال والويب.
  </div>

</aside>

<header class="topbar">

  <div class="brand">
    SubControl <i>⚡</i>
  </div>

  <div class="top-actions">

    <span id="headerEmail" class="user-email"></span>

    <button
      class="langbtn"
      id="langBtn"
      onclick="toggleLang()">
      EN
    </button>

    <button
      class="iconbtn"
      onclick="openAdd()">
      ＋
    </button>

  </div>

</header>


<main class="content">

<!-- HOME -->

<section class="screen on" id="home">

<div class="page-title">
  <div>
    <h1 data-ar="لوحة التحكم" data-en="Dashboard"></h1>
    <p
      data-ar="كل اشتراكاتك ومدفوعاتك في مكان واحد"
      data-en="All your subscriptions and payments in one place">
    </p>
  </div>
</div>

<div class="dashboard-grid">

<div>

<div class="hero">

  <small
    data-ar="التزاماتك الشهرية"
    data-en="Monthly commitments">
  </small>

  <div class="hero-amount" id="heroTotal">
    0
  </div>

  <div class="pills">
    <span class="pill" id="countPill"></span>
    <span class="pill" id="nearPill"></span>
    <span
      class="pill"
      data-ar="تحكم كامل في مكان واحد"
      data-en="Full control in one place">
    </span>
  </div>

</div>


<div class="card" style="margin-top:14px">

<div class="quick">

<button onclick="openAdd()">
  <b>＋</b>
  <span data-ar="إضافة اشتراك" data-en="Add subscription"></span>
</button>

<button onclick="scanInbox()">
  <b>✉️</b>
  <span data-ar="فحص البريد" data-en="Scan email"></span>
</button>

<button onclick="go('pay')">
  <b>◈</b>
  <span data-ar="السداد" data-en="Payments"></span>
</button>

</div>

</div>


<div class="section-head">

<h3
  data-ar="التجديدات القادمة"
  data-en="Upcoming renewals">
</h3>

<button
  class="linkbtn"
  onclick="go('subs')"
  data-ar="عرض الكل"
  data-en="View all">
</button>

</div>

<div id="homeList"></div>

</div>


<div>

<div class="detect">

<div class="detect-top">

<div>
  <div
    class="name"
    data-ar="الاكتشاف التلقائي"
    data-en="Auto detection">
  </div>

  <div class="meta" id="detectText"></div>
</div>

<div
  class="switch on"
  id="autoSwitch"
  onclick="toggleAuto()">
  <i></i>
</div>

</div>

<div class="detect-actions">

<button onclick="connectMail('gmail')">
  Gmail
</button>

<button onclick="connectMail('outlook')">
  Outlook
</button>

</div>

</div>


<div class="section-head">

<h3
  data-ar="SubControl AI"
  data-en="SubControl AI">
</h3>

</div>

<div class="card">

<div
  class="meta"
  id="aiText"
  style="font-size:12px;line-height:1.8">
</div>

</div>

</div>

</div>

</section>


<!-- SUBSCRIPTIONS -->

<section class="screen" id="subs">

<div class="page-title">

<div>

<h1
  data-ar="الاشتراكات"
  data-en="Subscriptions">
</h1>

<p
  data-ar="إضافة وتعديل وإيقاف وإلغاء الاشتراكات"
  data-en="Add, edit, pause and cancel subscriptions">
</p>

</div>

<button
  class="primary"
  onclick="openAdd()">
  + <span data-ar="إضافة" data-en="Add"></span>
</button>

</div>

<input
  id="search"
  class="search"
  placeholder="ابحث عن اشتراك..."
  oninput="renderSubs()">

<div id="allList"></div>

</section>


<!-- PAYMENTS -->

<section class="screen" id="pay">

<div class="page-title">

<div>

<h1
  data-ar="مركز السداد"
  data-en="Payment Center">
</h1>

<p
  data-ar="حدد الاشتراكات التي تريد سدادها"
  data-en="Select the subscriptions you want to pay">
</p>

</div>

</div>


<div class="card">

<div
  class="meta"
  data-ar="اختر الاشتراكات التي تريد جمعها في عملية واحدة"
  data-en="Choose subscriptions to combine into one payment flow">
</div>

<div id="payList"></div>

<div class="total">

<div>

<div
  class="meta"
  data-ar="إجمالي المحدد"
  data-en="Selected total">
</div>

/* ======================================================

window.supabase.createClient(

const $ = id => document.getElementById(id);

function showAuthMessage(message,type=''){
  authMessage.textContent = message;
  authMessage.className = 'auth-msg ' + type;
}

function showLogin(){

  loginForm.classList.remove('hidden');
  signupForm.classList.add('hidden');

  loginTab.classList.add('on');
  signupTab.classList.remove('on');

  showAuthMessage('');
}

function showSignup(){

  signupForm.classList.remove('hidden');
  loginForm.classList.add('hidden');

  signupTab.classList.add('on');
  loginTab.classList.remove('on');

  showAuthMessage('');
}


async function signupUser(){

  const name =
    $('signupName').value.trim();

  const email =
    $('signupEmail').value.trim();

  const password =
    $('signupPassword').value;

  if(!email || !password){

    showAuthMessage(
      'أدخلي البريد الإلكتروني وكلمة المرور.',
      'error'
    );

    return;
  }

  if(password.length < 8){

    showAuthMessage(
      'كلمة المرور يجب أن تكون 8 أحرف على الأقل.',
      'error'
    );

    return;
  }

  showAuthMessage(
    'جاري إنشاء الحساب...'
  );

  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email,
    password,

    options:{
      data:{
        full_name:name
      }
    }

  });


  if(error){

    showAuthMessage(
      error.message,
      'error'
    );

    return;
  }


  if(data.session){

    showAuthMessage(
      'تم إنشاء الحساب بنجاح.',
      'ok'
    );

  }else{

    showAuthMessage(
      'تم إنشاء الحساب. افتحي رسالة التأكيد في بريدك الإلكتروني ثم سجلي الدخول.',
      'ok'
    );

  }

}


async function loginUser(){

  const email =
    $('loginEmail').value.trim();

  const password =
    $('loginPassword').value;

  if(!email || !password){

    showAuthMessage(
      'أدخلي البريد الإلكتروني وكلمة المرور.',
      'error'
    );

    return;
  }


  showAuthMessage(
    'جاري تسجيل الدخول...'
  );


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });


  if(error){

    showAuthMessage(
      error.message,
      'error'
    );

    return;
  }


  currentUser = data.user;

  showApp();

}


async function logoutUser(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  mainApp.classList.add('hidden');
  authScreen.classList.remove('hidden');

  showLogin();

  toast('تم تسجيل الخروج');

}


async function forgotPassword(){

  const email =
    $('loginEmail').value.trim();

  if(!email){

    showAuthMessage(
      'اكتبي بريدك الإلكتروني أولًا.',
      'error'
    );

    return;
  }


  const redirectTo =
  'https://wedadabutaleb-art.github.io/-SubControl/';


  const {
    error
  } =
  await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo
    }
  );


  if(error){

    showAuthMessage(
      error.message,
      'error'
    );

    return;
  }


  showAuthMessage(
    'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.',
    'ok'
  );

}


function showApp(){

  if(!currentUser) return;

  authScreen.classList.add('hidden');
  mainApp.classList.remove('hidden');

  $('headerEmail').textContent =
    currentUser.email || '';

  $('profileEmail').textContent =
    currentUser.email || '—';

  render();

}


/* ======================================================
   AUTH SESSION
====================================================== */

async function initialiseAuth(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(session?.user){

    currentUser = session.user;

    showApp();

  }else{

    authScreen.classList.remove('hidden');
    mainApp.classList.add('hidden');

  }

}


supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(session?.user){

      currentUser = session.user;

      showApp();

    }else if(
      event === 'SIGNED_OUT'
    ){

      currentUser = null;

      mainApp.classList.add('hidden');
      authScreen.classList.remove('hidden');

    }

  }
);


/* ======================================================
   LANGUAGE
====================================================== */

let lang =
localStorage.getItem(
  'subcontrol_lang'
) || 'ar';


function applyLang(){

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === 'ar'
    ? 'rtl'
    : 'ltr';


  $('langBtn').textContent =
    lang === 'ar'
    ? 'EN'
    : 'عربي';


  document
  .querySelectorAll('[data-ar]')
  .forEach(el=>{

    el.textContent =
      lang === 'ar'
      ? el.dataset.ar
      : el.dataset.en;

  });


  $('search').placeholder =
    lang === 'ar'
    ? 'ابحث عن اشتراك...'
    : 'Search subscriptions...';


  localStorage.setItem(
    'subcontrol_lang',
    lang
  );


  buildNav();
  render();

}


function toggleLang(){

  lang =
    lang === 'ar'
    ? 'en'
    : 'ar';

  applyLang();

}


/* ======================================================
   NAVIGATION
====================================================== */

const navItems = [

  ['home','⌂','الرئيسية','Home'],

  ['subs','▣','الاشتراكات','Subscriptions'],

  ['pay','◈','السداد','Payments'],

  ['analytics','◔','التحليلات','Analytics'],

  ['profile','◉','الحساب','Account']

];

let current = 'home';


function buildNav(){

  const html =
  navItems
  .map(
    ([id,icon,ar,en])=>
    `
    <button
      class="${current===id?'on':''}"
      onclick="go('${id}')">

      <span>
      ${lang==='ar'?ar:en}
      </span>

    </button>
    `
  )
  .join('');


  bottomNav.innerHTML = html;
  sideNav.innerHTML = html;

}

  current = id;

  document
  .querySelectorAll('.screen')
  .forEach(el=>
    el.classList.remove('on')
  );


  $(id).classList.add('on');

    top:0,
    behavior:'smooth'
  });

}


/* ======================================================
   SUBSCRIPTIONS
   مؤقتًا Local Storage لكل مستخدم
====================================================== */

function userStorageKey(){

  if(!currentUser)
    return 'subcontrol_guest';

  return (
    'subcontrol_subscriptions_' +
    currentUser.id
  );

}


function plusDays(n){

  const d = new Date();

  d.setDate(
    d.getDate()+n
  );

  return d
  .toISOString()
  .slice(0,10);

}


const seed = [

{
 id:1,
 name:'ChatGPT Plus',
 icon:'🤖',
 price:75,
 cycle:'monthly',
 date:plusDays(8),
 status:'active',
 payment:'Visa •••• 1248',
 url:'https://chatgpt.com',
 providerKey:'chatgpt'
},

{
 id:2,
 name:'Netflix',
 icon:'🎬',
 price:69,
 cycle:'monthly',
 date:plusDays(3),
 status:'active',
 payment:'Mada •••• 8841',
 url:'https://www.netflix.com/account',
 providerKey:'netflix'
},

{
 id:3,
 name:'iCloud+',
 icon:'☁️',
 price:14.99,
 cycle:'monthly',
 date:plusDays(13),
 status:'active',
 payment:'Apple Pay',
 url:'https://apps.apple.com/account/subscriptions',
 providerKey:'apple'
},

{
 id:4,
 name:'Canva Pro',
 icon:'🎨',
 price:450,
 cycle:'yearly',
 date:plusDays(25),
 status:'active',
 payment:'Visa •••• 1248',
 url:'https://www.canva.com/settings/billing-and-plans',
 providerKey:'canva'
}

];


let subs = [];
let selected = new Set();
let autoDetect = true;


function loadLocalSubscriptions(){

  try{

    const stored =
      localStorage.getItem(
        userStorageKey()
      );

    subs =
      stored
      ? JSON.parse(stored)
      : JSON.parse(
          JSON.stringify(seed)
        );

  }catch{

    subs =
      JSON.parse(
        JSON.stringify(seed)
      );

  }

}


function persist(){

  localStorage.setItem(
    userStorageKey(),
    JSON.stringify(subs)
  );

}


/* ======================================================
   UTILS
====================================================== */

function monthly(x){

  if(
    x.status === 'cancelled'
  )
    return 0;

  return (
    x.cycle === 'monthly'
    ? Number(x.price)
    : Number(x.price)/12
  );

}


function money(value){

  const v =
    Number(value)||0;

  if(lang === 'ar'){

    return (
      v.toLocaleString(
        'ar-SA',
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      ) +
      ' ر.س'
    );

  }


  return (
    'SAR ' +
    v.toLocaleString(
      'en-US',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    )
  );

}


function daysLeft(date){

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  const target =
    new Date(
      date+'T00:00:00'
    );


  return Math.ceil(
    (target-today)/
    86400000
  );

}


function esc(value){

  return String(value)
  .replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

}


/* ======================================================
   RENDER
====================================================== */

function statusText(status){

  const ar = {
    active:'نشط',
    paused:'موقوف',
    cancelled:'ملغي',
    pending_cancel:'قيد الإلغاء',
    action_required:'أكمل لدى المزود'
  };

  const en = {
    active:'Active',
    paused:'Paused',
    cancelled:'Cancelled',
    pending_cancel:'Cancellation pending',
    action_required:'Action required'
  };

  return (
    lang === 'ar'
    ? ar[status]
    : en[status]
  ) || status;

}


function card(x,full=false){

  const d =
    daysLeft(x.date);


  let renewalText = '';


  if(lang === 'ar'){

    if(d < 0)
      renewalText =
        `متأخر ${Math.abs(d)} يوم`;

    else if(d === 0)
      renewalText =
        'التجديد اليوم';

    else
      renewalText =
        `التجديد بعد ${d} يوم`;

  }else{

    if(d < 0)
      renewalText =
        `Overdue ${Math.abs(d)} days`;

    else if(d === 0)
      renewalText =
        'Renews today';

    else
      renewalText =
        `Renews in ${d} days`;

  }


  return `
  <div class="card">

    <div class="sub">

      <div class="ico">
      ${x.icon||'⭐'}
      </div>

      <div>

        <div class="name">
        ${esc(x.name)}
        </div>

        <div class="meta">
          ${
            x.cycle==='monthly'
            ? (
              lang==='ar'
              ? 'شهري'
              : 'Monthly'
            )
            : (
              lang==='ar'
              ? 'سنوي'
              : 'Annual'
            )
          }
          •
          ${renewalText}
        </div>

        <span class="tag ${x.status}">
          ${statusText(x.status)}
        </span>

      </div>

      <div class="price">

        ${money(x.price)}

      </div>

    </div>

    ${
      full
      ?
      `
      <div class="row-actions">

        <button
          class="ghost"
          onclick="openEdit(${x.id})">
          ${lang==='ar'?'تعديل':'Edit'}
        </button>

        <button
          class="ghost"
          onclick="togglePause(${x.id})">
          ${
            x.status==='paused'
            ? (
              lang==='ar'
              ? 'استئناف'
              : 'Resume'
            )
            : (
              lang==='ar'
              ? 'إيقاف'
              : 'Pause'
            )
          }
        </button>

        <button
          class="danger"
          onclick="cancelSub(${x.id})">
          ${
            lang==='ar'
            ? 'إلغاء الاشتراك'
            : 'Cancel subscription'
          }
        </button>

      </div>
      `
      :
      ''
    }

  </div>
  `;

}


function render(){

  if(!currentUser)
    return;


  loadLocalSubscriptions();


  const active =
    subs.filter(
      x=>x.status==='active'
    );


  const total =
    active.reduce(
      (sum,x)=>
      sum+monthly(x),
      0
    );


  $('heroTotal').textContent =
    money(total);


  $('countPill').textContent =
    active.length +
    (
      lang==='ar'
      ? ' اشتراك نشط'
      : ' active subscriptions'
    );


  const near =
    active.filter(x=>{

      const d =
        daysLeft(x.date);

      return (
        d>=0 &&
        d<=7
      );

    }).length;


  $('nearPill').textContent =
    near +
    (
      lang==='ar'
      ? ' تجديد قريب'
      : ' near renewals'
    );


  const upcoming =
    [...active]
    .sort(
      (a,b)=>
      new Date(a.date)-
      new Date(b.date)
    )
    .slice(0,4);


  $('homeList').innerHTML =
    upcoming.length
    ? upcoming
      .map(x=>card(x))
      .join('')
    : `
      <div class="empty">
      ${
        lang==='ar'
        ? 'لا توجد تجديدات قادمة'
        : 'No upcoming renewals'
      }
      </div>
    `;


  $('m1').textContent =
    money(total);

  $('m2').textContent =
    money(total*12);

  $('m3').textContent =
    active.length;

  $('m4').textContent =
    subs.length-
    active.length;


  const avoided =
    subs
    .filter(
      x=>
      x.status!=='active'
    )
    .reduce(
      (sum,x)=>
      sum+
      (
        x.cycle==='monthly'
        ? Number(x.price)
        : Number(x.price)/12
      ),
      0
    );


  $('savingText').textContent =
    avoided
    ?
    (
      lang==='ar'
      ?
      `الاشتراكات الموقوفة أو الملغاة تمثل تقريبًا ${money(avoided)} شهريًا.`
      :
      `Paused or cancelled subscriptions represent about ${money(avoided)} per month.`
    )
    :
    (
      lang==='ar'
      ? 'لا توجد وفورات مسجلة حتى الآن.'
      : 'No recorded savings yet.'
    );


  $('aiText').textContent =
    active.length
    ?
    (
      lang==='ar'
      ?
      `لديك ${active.length} اشتراكات نشطة بقيمة شهرية تقديرية ${money(total)}. راجعي الاشتراكات قبل موعد التجديد لتجنب المدفوعات غير الضرورية.`
      :
      `You have ${active.length} active subscriptions with estimated monthly spending of ${money(total)}. Review subscriptions before renewal to avoid unnecessary charges.`
    )
    :
    (
      lang==='ar'
      ? 'أضيفي اشتراكاتك وسأعرض لك التحليل.'
      : 'Add your subscriptions to see your analysis.'
    );


  $('detectText').textContent =
    autoDetect
    ?
    (
      lang==='ar'
      ? 'مفعل — جاهز لربط البريد'
      : 'Enabled — ready for email connection'
    )
    :
    (
      lang==='ar'
      ? 'متوقف مؤقتًا'
      : 'Temporarily paused'
    );


  renderSubs();
  renderPay();

}


function renderSubs(){

  const q =
    (search.value||'')
    .trim()
    .toLowerCase();


  const list =
    subs.filter(
      x=>
      x.name
      .toLowerCase()
      .includes(q)
    );


  $('allList').innerHTML =
    list.length
    ?
    list
    .map(
      x=>card(x,true)
    )
    .join('')
    :
    `
    <div class="empty">
    ${
      lang==='ar'
      ? 'لا توجد نتائج'
      : 'No results'
    }
    </div>
    `;

}


function renderPay(){

  const list =
    subs.filter(
      x=>
      x.status==='active'
    );


  $('payList').innerHTML =
    list.length
    ?
    list.map(
      x=>
      `
      <label class="profile-row">

        <input
          type="checkbox"
          ${selected.has(x.id)?'checked':''}
          onchange="toggleSel(${x.id},this.checked)">

        <span style="flex:1">
          <b>${esc(x.name)}</b>
          <div class="meta">
          ${x.payment||'—'}
          </div>
        </span>

        <b>
        ${money(monthly(x))}
        </b>

      </label>
      `
    ).join('')
    :
    `
    <div class="empty">
    ${
      lang==='ar'
      ? 'لا توجد اشتراكات نشطة'
      : 'No active subscriptions'
    }
    </div>
    `;


  const chosen =
    list.filter(
      x=>
      selected.has(x.id)
    );


  const total =
    chosen.reduce(
      (sum,x)=>
      sum+monthly(x),
      0
    );


  $('payTotal').textContent =
    money(total);


  $('payCount').textContent =
    chosen.length +
    (
      lang==='ar'
      ? ' محدد'
      : ' selected'
    );

}


/* ======================================================
   MODAL
====================================================== */

const providerUrls = {

  chatgpt:
  'https://chatgpt.com/',

  netflix:
  'https://www.netflix.com/account',

  adobe:
  'https://account.adobe.com/plans',

  canva:
  'https://www.canva.com/settings/billing-and-plans',

  spotify:
  'https://www.spotify.com/account/subscription/',

  microsoft365:
  'https://account.microsoft.com/services/',

  googleone:
  'https://one.google.com/settings',

  apple:
  'https://apps.apple.com/account/subscriptions'

};


function providerChanged(){

  const key =
    $('fProvider').value;

  if(
    providerUrls[key] &&
    !$('fUrl').value.trim()
  ){

    $('fUrl').value =
      providerUrls[key];

  }

}


function openAdd(){

  $('modalTitle').textContent =
    lang==='ar'
    ? 'إضافة اشتراك'
    : 'Add subscription';


  $('editId').value = '';
  $('fName').value = '';
  $('fPrice').value = '';
  $('fDate').value = '';
  $('fPayment').value = '';
  $('fUrl').value = '';
  $('fProvider').value = '';
  $('fExternalId').value = '';

  $('fEmail').value =
    currentUser?.email || '';

  $('fCycle').value =
    'monthly';

  $('fStatus').value =
    'active';

  subModal.classList.add('on');

}


function openEdit(id){

  const x =
    subs.find(
      s=>s.id===id
    );

  if(!x)
    return;


  $('modalTitle').textContent =
    lang==='ar'
    ? 'تعديل الاشتراك'
    : 'Edit subscription';


  $('editId').value =
    x.id;

  $('fName').value =
    x.name;

  $('fPrice').value =
    x.price;

  $('fCycle').value =
    x.cycle;

  $('fDate').value =
    x.date;

  $('fStatus').value =
    x.status;

  $('fPayment').value =
    x.payment||'';

  $('fUrl').value =
    x.url||'';

  $('fProvider').value =
    x.providerKey||'';

  $('fExternalId').value =
    x.externalSubscriptionId||'';

  $('fEmail').value =
    x.userEmail||
    currentUser?.email||
    '';


  subModal.classList.add('on');

}


function closeModal(){

  subModal.classList.remove('on');

}


function saveSub(){

  const name =
    $('fName').value.trim();

  const price =
    parseFloat(
      $('fPrice').value
    );

  const date =
    $('fDate').value;


  if(
    !name ||
    !Number.isFinite(price) ||
    price<0 ||
    !date
  ){

    toast(
      lang==='ar'
      ? 'أكملي اسم الخدمة والسعر وتاريخ التجديد'
      : 'Complete service name, price and renewal date'
    );

    return;

  }


  const editId =
    Number(
      $('editId').value
    );


  const old =
    subs.find(
      x=>x.id===editId
    );


  const obj = {

    id:
      editId ||
      Date.now(),

    name,

    icon:
      old?.icon ||
      '⭐',

    price,

    cycle:
      $('fCycle').value,

    date,

    status:
      $('fStatus').value,

    payment:
      $('fPayment')
      .value
      .trim(),

    url:
      $('fUrl')
      .value
      .trim(),

    providerKey:
      $('fProvider')
      .value,

    externalSubscriptionId:
      $('fExternalId')
      .value
      .trim(),

    userEmail:
      $('fEmail')
      .value
      .trim()

  };


  if(editId){

    subs =
      subs.map(
        x=>
        x.id===editId
        ? obj
        : x
      );

  }else{

    subs.push(obj);

  }


  persist();

  closeModal();

  render();

  toast(
    editId
    ?
    (
      lang==='ar'
      ? 'تم تحديث الاشتراك'
      : 'Subscription updated'
    )
    :
    (
      lang==='ar'
      ? 'تمت إضافة الاشتراك'
      : 'Subscription added'
    )
  );

}


/* ======================================================
   ACTIONS
====================================================== */

function togglePause(id){

  subs =
    subs.map(x=>{

      if(x.id!==id)
        return x;

      return {
        ...x,
        status:
          x.status==='paused'
          ? 'active'
          : 'paused'
      };

    });


  persist();
  render();

}


function cancelSub(id){

  const x =
    subs.find(
      s=>s.id===id
    );

  if(!x)
    return;


  const message =
    lang==='ar'
    ?
    `هل تريدين بدء إلغاء اشتراك ${x.name}؟`
    :
    `Start cancellation for ${x.name}?`;


  if(!confirm(message))
    return;


  if(x.url){

    x.status =
      'action_required';

    persist();
    render();


    window.open(
      x.url,
      '_blank',
      'noopener'
    );


    toast(
      lang==='ar'
      ? 'تم فتح صفحة المزود الرسمية. لن نعتبر الاشتراك ملغيًا قبل التأكيد.'
      : 'Official provider page opened. Subscription remains active until cancellation is confirmed.'
    );

  }else{

    x.status =
      'pending_cancel';

    persist();
    render();


    toast(
      lang==='ar'
      ? 'تم وضع الاشتراك قيد الإلغاء.'
      : 'Subscription marked as cancellation pending.'
    );

  }

}


function toggleSel(id,value){

  if(value)
    selected.add(id);
  else
    selected.delete(id);

  renderPay();

}


function simulate(method){

  if(!selected.size){

    toast(
      lang==='ar'
      ? 'اختاري اشتراكًا واحدًا على الأقل'
      : 'Select at least one subscription'
    );

    return;

  }


  toast(
    lang==='ar'
    ? `${method} — السداد الفعلي سيتم ربطه لاحقًا`
    : `${method} — real payment integration will be added later`
  );

}


function toggleAuto(){

  autoDetect =
    !autoDetect;

  $('autoSwitch')
  .classList
  .toggle(
    'on',
    autoDetect
  );

  render();

}


/* ======================================================
   EMAIL PLACEHOLDER
====================================================== */

function connectMail(provider){

  toast(
    lang==='ar'
    ?
    `تسجيل الدخول يعمل الآن. سنربط ${provider} عبر OAuth في الخطوة التالية.`
    :
    `Authentication is live. ${provider} OAuth will be connected in the next step.`
  );

}


function scanInbox(){

  toast(
    lang==='ar'
    ? 'سيتم تفعيل فحص البريد بعد إعداد Gmail / Outlook OAuth.'
    : 'Inbox scanning will activate after Gmail / Outlook OAuth setup.'
  );

}


/* ======================================================
   TOAST
====================================================== */

function toast(message){

  const el =
    $('toast');

  el.textContent =
    message;

  el.classList.add('on');

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      ()=>
      el.classList.remove('on'),
      2700
    );

}


/* ======================================================
   MODAL BACKDROP
====================================================== */

subModal.addEventListener(
  'click',
  event=>{

    if(
      event.target ===
      subModal
    ){

      closeModal();

    }

  }
);


/* ======================================================
   START
====================================================== */

applyLang();
initialiseAuth();

</script>
