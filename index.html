</div><div>

function statusText(s){return t(s)}function card(x,full=false){let d=daysLeft(x.date),when=d<0?`${t('overdue')} ${Math.abs(d)} ${t('days')}`:d===0?t('renewToday'):`${t('renewAfter')} ${d} ${t('days')}`;return `<div class="card"><div class="sub"><div class="ico">${x.icon||'⭐'}</div><div><div class="name">${esc(x.name)}</div><div class="meta">${t(x.cycle==='monthly'?'monthly':'annual')} • ${when}</div><span class="tag ${x.status}">${statusText(x.status)}</span></div><div class="price">${money(x.price)}<div class="meta">${t(x.cycle==='monthly'?'monthly':'annual')}</div></div></div>${full?`<div class="row-actions"><button class="ghost" onclick="openEdit(${x.id})">${t('edit')}</button><button class="ghost" onclick="togglePause(${x.id})">${x.status==='paused'?t('resume'):t('pause')}</button><button class="danger" onclick="cancelSub(${x.id})">${t('cancel')}</button></div>`:''}</div>`}

function togglePause(id){subs=subs.map(x=>x.id===id?{...x,status:x.status==='paused'?'active':'paused'}:x);persist();render();toast(t('statusUpdated'))}async function cancelSub(id){let x=subs.find(s=>s.id===id);if(!x)return;if(!confirm(lang==='ar'?`هل تريد إلغاء اشتراك ${x.name} فعليًا لدى مزود الخدمة؟`:`Cancel ${x.name} with the provider?`))return;toast(t('cancelling'));try{const r=await fetch('/api/cancel-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({localSubscriptionId:x.id,serviceName:x.name,providerKey:x.providerKey||'',externalSubscriptionId:x.externalSubscriptionId||'',userEmail:x.userEmail||'',providerCancelEmail:x.providerCancelEmail||'',manageUrl:x.url||''})});const data=await r.json().catch(()=>({}));if(r.ok&&data.status==='cancelled'){subs=subs.map(s=>s.id===id?{...s,status:'cancelled',cancelReference:data.reference||'',cancelledAt:data.cancelledAt||new Date().toISOString()}:s);selected.delete(id);persist();render();toast(t('cancelledMsg'));return}if(r.ok&&data.status==='pending'){subs=subs.map(s=>s.id===id?{...s,status:'pending_cancel',cancelReference:data.reference||''}:s);selected.delete(id);persist();render();toast(t('cancelPending'));return}if(r.ok&&data.status==='action_required'){subs=subs.map(s=>s.id===id?{...s,status:'action_required',cancelReference:data.reference||'',url:data.manageUrl||s.url}:s);selected.delete(id);persist();render();toast(t('cancelAction'));if(data.manageUrl)setTimeout(()=>window.open(data.manageUrl,'_blank','noopener'),650);return}if(data.manageUrl||x.url){toast(t('cancelFailed'));setTimeout(()=>window.open(data.manageUrl||x.url,'_blank','noopener'),500);return}toast(data.message||t('cancelFailed'))}catch(e){toast(t('cancelFailed'));if(x.url)setTimeout(()=>window.open(x.url,'_blank'),500)}}function toggleSel(id,v){v?selected.add(id):selected.delete(id);renderPay()}function simulate(method){if(!selected.size)return toast(t('chooseOne'));toast(method+' — '+t('paymentDemo'))}

async function scanInbox(){
  const pending=subs.filter(x=>['pending_cancel','action_required'].includes(x.status));
  if(!pending.length)return toast(lang==='ar'?'لا توجد اشتراكات بانتظار تأكيد الإلغاء':'No subscriptions are awaiting cancellation confirmation');
  toast(lang==='ar'?'جاري فحص رسائل تأكيد الإلغاء...':'Scanning for cancellation confirmations...');
  try{
    const r=await fetch('/api/mail/scan-cancellations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userKey:USER_KEY,subscriptions:pending.map(x=>({id:x.id,name:x.name,status:x.status,providerKey:x.providerKey||''}))})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.message||'scan failed');
    await refreshMailStatus();
    if(!data.found?.length)return toast(lang==='ar'?'لم يصل تأكيد إلغاء مطابق حتى الآن':'No matching cancellation confirmation found yet');
    let names=[];
    for(const hit of data.found){
      const sub=subs.find(x=>String(x.id)===String(hit.subscriptionId)); if(!sub||sub.status==='cancelled')continue;
      sub.status='cancelled';sub.cancelledAt=new Date().toISOString();sub.confirmedBy=hit.mailProvider;sub.confirmationMessageId=hit.messageId||'';names.push(sub.name);selected.delete(sub.id);
      try{await fetch('/api/cancellation-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceName:sub.name,userEmail:sub.userEmail||'',reference:sub.cancelReference||'',providerReference:`${hit.mailProvider}:${hit.messageId||''}`})})}catch{}
    }
    persist();render();toast(lang==='ar'?`تم تأكيد إلغاء: ${names.join('، ')}`:`Cancellation confirmed: ${names.join(', ')}`);
  }catch(e){toast(lang==='ar'?'تعذر فحص البريد. تحقق من ربط Gmail/Outlook وإعدادات الخادم.':'Mailbox scan failed. Check Gmail/Outlook connection and server settings.')}
}function reviewAlert(id){let a=alerts.find(x=>x.id===id);if(a?.type==='new'){if(!subs.some(x=>x.name===a.title))subs.push({id:Date.now(),name:a.title,icon:'🎵',price:39.99,cycle:'monthly',date:plusDays(20),status:'active',payment:'',url:''});persist();alerts=alerts.filter(x=>x.id!==id);render();toast(t('addedDetected'))}else toast(t('reviewPrice'))}function dismissAlert(id){alerts=alerts.filter(x=>x.id!==id);renderAlerts()}function resetDemo(){if(!confirm(t('resetQ')))return;subs=JSON.parse(JSON.stringify(seed));selected.clear();persist();render();toast(t('resetDone'))}
function go(id){current=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');buildNav();window.scrollTo({top:0,behavior:'smooth'})}function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('on'),2400)}

// Robust click delegation: works even where inline onclick handlers are restricted.
document.addEventListener('click', function(e){
  const el=e.target.closest('button,[data-action],.switch');
  if(!el) return;
  const action=el.dataset.action;
  if(action==='toggle-lang'){ e.preventDefault(); toggleLang(); return; }
  if(action==='open-add'){ e.preventDefault(); openAdd(); return; }
  // Re-handle common inline actions from their text/attributes if a WebView blocks inline JS.
  const oc=el.getAttribute('onclick')||'';
  let m;
  if((m=oc.match(/^go\('([^']+)'\)/))){ e.preventDefault(); go(m[1]); return; }
  if((m=oc.match(/^openEdit\((\d+)\)/))){ e.preventDefault(); openEdit(Number(m[1])); return; }
  if((m=oc.match(/^togglePause\((\d+)\)/))){ e.preventDefault(); togglePause(Number(m[1])); return; }
  if((m=oc.match(/^cancelSub\((\d+)\)/))){ e.preventDefault(); cancelSub(Number(m[1])); return; }
});
