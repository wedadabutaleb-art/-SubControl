<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071221">
<title>SubControl</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#030814;--panel:#0b1728;--panel2:#111f33;--line:#223752;--text:#f7fafc;--muted:#8fa3bb;--brand:#7567ff;--brand2:#9a8fff;--green:#2ed47a;--red:#ff6b78}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 80% 10%,#5948d755,transparent 28%),#030814}.auth-card{width:min(100%,430px);background:#081526e8;border:1px solid #233a58;border-radius:28px;padding:28px 22px;box-shadow:0 30px 80px #0008}.auth-logo{text-align:center;font-size:29px;font-weight:950;margin-bottom:6px}.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#111f33;padding:5px;border-radius:14px;margin-bottom:20px}.auth-tabs button{border:0;background:transparent;color:#869ab2;padding:11px;border-radius:10px;font-weight:850}.auth-tabs button.on{color:white;background:var(--brand)}.field,.auth-field{margin-bottom:12px}.field label,.auth-field label{display:block;color:#9db0c6;font-size:11px;margin-bottom:6px}.field input,.field select,.auth-field input{width:100%;border:1px solid #2a4160;background:#0f1e32;color:white;padding:13px;border-radius:12px;outline:none}.auth-main-btn,.primary{border:0;background:linear-gradient(135deg,#6356ef,#8477ff);color:white;font-weight:900}.auth-main-btn{width:100%;padding:14px;border-radius:13px}.auth-link{border:0;background:none;color:#aaa2ff;font-weight:800;display:block;margin:15px auto 0}.auth-msg{margin-top:14px;text-align:center;font-size:12px;min-height:20px}.auth-msg.error{color:#ff8f99}.auth-msg.ok{color:#72e7a7}
.app{min-height:100vh;background:linear-gradient(180deg,#06101f,#030814)}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#071221e8;position:sticky;top:0;z-index:10}.brand{font-weight:950;font-size:23px}.top-actions{display:flex;gap:8px;align-items:center}.iconbtn,.langbtn{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:12px;height:40px;padding:0 12px;font-weight:800}.iconbtn{width:40px}.user-email{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aebfff;font-size:11px}.content{padding:18px 16px 100px;max-width:1050px;margin:auto}.screen{display:none}.screen.on{display:block}.hero{padding:24px;border-radius:22px;background:linear-gradient(135deg,#5145df,#7968ff);box-shadow:0 16px 40px #5547ef33}.hero-amount{font-size:38px;font-weight:950;margin:6px 0 14px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 9px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff25;font-size:11px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.quick button{background:var(--panel2);border:1px solid var(--line);color:white;border-radius:14px;padding:13px 8px;font-weight:850}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.linkbtn{border:0;background:none;color:var(--brand2);font-weight:850}.sub{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center}.ico{width:46px;height:46px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;font-size:21px}.name{font-weight:850}.meta{font-size:11px;color:var(--muted);margin-top:3px}.price{font-weight:900;text-align:end}.tag{display:inline-block;margin-top:5px;font-size:9px;padding:4px 7px;border-radius:99px;font-weight:850}.active{background:#17854b25;color:#68e6a0}.paused{background:#9e681d28;color:#ffc773}.cancelled{background:#8c263428;color:#ff929d}.pending_cancel{background:#6b4d1738;color:#ffd27a}.action_required{background:#3b4f8b38;color:#aebfff}.row-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.ghost,.danger,.primary{border-radius:10px;padding:8px 10px;font-size:11px;font-weight:850}.ghost{background:#172842;color:white;border:1px solid #2c4462}.danger{background:#5b1d2a;color:#ffabb3;border:1px solid #833040}.search{width:100%;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:white;margin:8px 0 12px}.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.metric strong{display:block;font-size:22px;margin-top:4px}.bottomnav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#071221f4;border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:12}.bottomnav button{border:0;background:none;color:#73859d;font-size:10px}.bottomnav .on{color:var(--brand2)}.bottomnav strong{display:block;font-size:17px}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.on{display:flex}.sheet{width:min(100%,620px);max-height:90vh;overflow:auto;background:#0b1728;border:1px solid #263c58;border-radius:24px 24px 0 0;padding:18px 16px 24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.sheet-actions button{padding:12px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(15px);width:min(92%,520px);background:#172842;border:1px solid #304966;padding:12px 14px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:12px}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">⚡ SubControl</div>
    <div class="auth-sub">تحكم في اشتراكاتك ومدفوعاتك من مكان واحد</div>
    <div class="auth-tabs">
      <button id="loginTab" class="on" onclick="showLogin()">تسجيل الدخول</button>
      <button id="signupTab" onclick="showSignup()">إنشاء حساب</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"></div>
      <div class="auth-field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="auth-main-btn" onclick="loginUser()">تسجيل الدخول</button>
      <button class="auth-link" onclick="forgotPassword()">نسيت كلمة المرور؟</button>
    </div>
    <div id="signupForm" class="hidden">
      <div class="auth-field"><label>الاسم</label><input id="signupName"></div>
      <div class="auth-field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email"></div>
      <div class="auth-field"><label>كلمة المرور</label><input id="signupPassword" type="password"></div>
      <button class="auth-main-btn" onclick="signupUser()">إنشاء الحساب</button>
    </div>
    <div id="authMessage" class="auth-msg"></div>
  </div>
</section>

<div id="mainApp" class="app hidden">
<header class="topbar">
  <div class="brand">SubControl ⚡</div>
  <div class="top-actions">
    <span id="headerEmail" class="user-email"></span>
    <button id="langBtn" class="langbtn" onclick="toggleLang()">EN</button>
    <button class="iconbtn" onclick="openAdd()">＋</button>
  </div>
</header>
<main class="content">
<section class="screen on" id="home">
  <h1 data-ar="لوحة التحكم" data-en="Dashboard"></h1>
  <div class="hero">
    <small data-ar="التزاماتك الشهرية" data-en="Monthly commitments"></small>
    <div class="hero-amount" id="heroTotal">0</div>
    <div class="pills"><span class="pill" id="countPill"></span><span class="pill" id="nearPill"></span></div>
  </div>
  <div class="quick">
    <button onclick="openAdd()">＋<br><span data-ar="إضافة اشتراك" data-en="Add subscription"></span></button>
    <button onclick="scanInbox()">✉️<br><span data-ar="فحص البريد" data-en="Scan email"></span></button>
    <button onclick="go('pay')">◈<br><span data-ar="السداد" data-en="Payments"></span></button>
  </div>
  <div class="section-head"><h3 data-ar="التجديدات القادمة" data-en="Upcoming renewals"></h3><button class="linkbtn" onclick="go('subs')">عرض الكل</button></div>
  <div id="homeList"></div>
  <div class="card"><b>✨ SubControl AI</b><div class="meta" id="aiText"></div></div>
</section>

<section class="screen" id="subs">
  <h1 data-ar="الاشتراكات" data-en="Subscriptions"></h1>
  <button class="primary" onclick="openAdd()">+ إضافة</button>
  <input id="search" class="search" placeholder="ابحث عن اشتراك..." oninput="renderSubs()">
  <div id="allList"></div>
</section>

<section class="screen" id="pay">
  <h1 data-ar="مركز السداد" data-en="Payment Center"></h1>
  <div class="card"><div id="payList"></div><div class="section-head"><strong id="payTotal">0</strong><span id="payCount" class="meta"></span></div></div>
</section>

<section class="screen" id="analytics">
  <h1 data-ar="التحليلات" data-en="Analytics"></h1>
  <div class="metricgrid">
    <div class="metric"><small>شهري</small><strong id="m1">0</strong></div>
    <div class="metric"><small>سنوي</small><strong id="m2">0</strong></div>
    <div class="metric"><small>نشط</small><strong id="m3">0</strong></div>
    <div class="metric"><small>غير نشط</small><strong id="m4">0</strong></div>
  </div>
</section>

<section class="screen" id="profile">
  <h1 data-ar="الحساب" data-en="Account"></h1>
  <div class="card"><div class="meta">البريد الإلكتروني</div><b id="profileEmail">—</b><div class="row-actions"><button class="danger" onclick="logoutUser()">تسجيل الخروج</button></div></div>
</section>
</main>
<nav id="bottomNav" class="bottomnav"></nav>
</div>

<div id="subModal" class="modal"><div class="sheet">
  <h2 id="modalTitle">إضافة اشتراك</h2>
  <input type="hidden" id="editId">
  <div class="grid2"><div class="field"><label>اسم الخدمة</label><input id="fName"></div><div class="field"><label>السعر</label><input id="fPrice" type="number" step="0.01"></div></div>
  <div class="grid2"><div class="field"><label>دورة الفوترة</label><select id="fCycle"><option value="monthly">شهري</option><option value="yearly">سنوي</option></select></div><div class="field"><label>تاريخ التجديد</label><input id="fDate" type="date"></div></div>
  <div class="grid2"><div class="field"><label>الحالة</label><select id="fStatus"><option value="active">نشط</option><option value="paused">موقوف</option><option value="cancelled">ملغي</option></select></div><div class="field"><label>طريقة الدفع</label><input id="fPayment"></div></div>
  <div class="field"><label>رابط إدارة الاشتراك</label><input id="fUrl"></div>
  <div class="grid2"><div class="field"><label>مزود الاشتراك</label><select id="fProvider" onchange="providerChanged()"><option value=""></option><option value="chatgpt">ChatGPT</option><option value="netflix">Netflix</option><option value="adobe">Adobe</option><option value="canva">Canva</option><option value="spotify">Spotify</option><option value="microsoft365">Microsoft 365</option><option value="googleone">Google One</option><option value="apple">Apple / App Store</option></select></div><div class="field"><label>رقم الاشتراك لدى المزود</label><input id="fExternalId"></div></div>
  <div class="field"><label>البريد المرتبط بالاشتراك</label><input id="fEmail" type="email"></div>
  <div class="sheet-actions"><button class="primary" onclick="saveSub()">حفظ</button><button class="ghost" onclick="closeModal()">إلغاء</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL='https://xptsdmsrxdczbgcaybxb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_nRufSl9ODK6bT-qhiBm1PQ_ELckjnHf';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let currentUser=null,subs=[],selected=new Set(),lang=localStorage.getItem('subcontrol_lang')||'ar',current='home';

function err(e){return [e?.message,e?.details,e?.hint,e?.code].filter(Boolean).join(' | ')||String(e||'Unknown error')}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('on'),5000)}
function showLogin(){$('loginForm').classList.remove('hidden');$('signupForm').classList.add('hidden');$('loginTab').classList.add('on');$('signupTab').classList.remove('on');$('authMessage').textContent=''}
function showSignup(){$('signupForm').classList.remove('hidden');$('loginForm').classList.add('hidden');$('signupTab').classList.add('on');$('loginTab').classList.remove('on');$('authMessage').textContent=''}
async function signupUser(){const email=$('signupEmail').value.trim(),password=$('signupPassword').value,name=$('signupName').value.trim();if(!email||password.length<8)return $('authMessage').textContent='أدخلي بريدًا صحيحًا وكلمة مرور 8 أحرف على الأقل';const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:'https://wedadabutaleb-art.github.io/-SubControl/'}});if(error)return $('authMessage').textContent=err(error);$('authMessage').textContent=data.session?'تم إنشاء الحساب':'تم إنشاء الحساب. أكدي البريد ثم سجلي الدخول.'}
async function loginUser(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return $('authMessage').textContent=err(error);currentUser=data.user;await showApp()}
async function logoutUser(){await supabaseClient.auth.signOut();location.reload()}
async function forgotPassword(){const email=$('loginEmail').value.trim();if(!email)return toast('اكتبي البريد أولًا');const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:'https://wedadabutaleb-art.github.io/-SubControl/'});toast(error?err(error):'تم إرسال رابط إعادة التعيين')}
async function showApp(){$('authScreen').classList.add('hidden');$('mainApp').classList.remove('hidden');$('headerEmail').textContent=currentUser.email||'';$('profileEmail').textContent=currentUser.email||'—';await loadSubs();render()}
async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(session?.user){currentUser=session.user;await showApp()}}
supabaseClient.auth.onAuthStateChange(async(ev,s)=>{if(s?.user){currentUser=s.user;if($('mainApp').classList.contains('hidden'))await showApp()}});

const nav=[['home','⌂','الرئيسية','Home'],['subs','▣','الاشتراكات','Subscriptions'],['pay','◈','السداد','Payments'],['analytics','◔','التحليلات','Analytics'],['profile','◉','الحساب','Account']];
function buildNav(){$('bottomNav').innerHTML=nav.map(([id,ic,ar,en])=>`<button class="${current===id?'on':''}" onclick="go('${id}')"><strong>${ic}</strong>${lang==='ar'?ar:en}</button>`).join('')}
function go(id){current=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');buildNav()}
function applyLang(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('langBtn').textContent=lang==='ar'?'EN':'عربي';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=lang==='ar'?el.dataset.ar:el.dataset.en);buildNav()}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('subcontrol_lang',lang);applyLang()}
function providerKey(v){v=String(v||'').toLowerCase();if(v.includes('netflix'))return'netflix';if(v.includes('chatgpt')||v.includes('openai'))return'chatgpt';if(v.includes('spotify'))return'spotify';if(v.includes('canva'))return'canva';if(v.includes('adobe'))return'adobe';if(v.includes('apple')||v.includes('icloud'))return'apple';if(v.includes('microsoft'))return'microsoft365';if(v.includes('google'))return'googleone';return v}
const providerUrls={netflix:'https://www.netflix.com/account',chatgpt:'https://chatgpt.com/',spotify:'https://www.spotify.com/account/subscription/',canva:'https://www.canva.com/settings/billing-and-plans',adobe:'https://account.adobe.com/plans',apple:'https://apps.apple.com/account/subscriptions',microsoft365:'https://account.microsoft.com/services/',googleone:'https://one.google.com/settings'};
function icon(p){return({netflix:'🎬',chatgpt:'🤖',spotify:'🎵',canva:'🎨',adobe:'🅰️',apple:'☁️',microsoft365:'🪟',googleone:'☁️'})[providerKey(p)]||'⭐'}
function parseNotes(v){try{return v?JSON.parse(v):{}}catch{return{}}}
async function loadSubs(){const{data,error}=await supabaseClient.from('subscriptions').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:true});if(error){alert('Supabase Error:\n\n'+err(error));return}subs=(data||[]).map(r=>{const n=parseNotes(r.notes);return{id:r.id,name:r.plan_name||r.provider_name,icon:icon(r.provider_name),price:Number(r.amount||0),cycle:r.billing_cycle||'monthly',date:r.next_renewal_date,status:r.status||'active',payment:n.payment||'',url:n.url||providerUrls[providerKey(r.provider_name)]||'',providerKey:providerKey(r.provider_name),externalSubscriptionId:r.provider_subscription_ref||'',userEmail:n.userEmail||currentUser.email||''}})}
function monthly(x){return x.status==='cancelled'?0:(x.cycle==='yearly'?Number(x.price)/12:Number(x.price))}
function money(v){return (Number(v)||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س'}
function days(date){if(!date)return 999;const a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(date+'T00:00:00')-a)/86400000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function card(x,full=false){const d=days(x.date),renew=d<0?`متأخر ${Math.abs(d)} يوم`:d===0?'التجديد اليوم':`التجديد بعد ${d} يوم`;return `<div class="card"><div class="sub"><div class="ico">${x.icon}</div><div><div class="name">${esc(x.name)}</div><div class="meta">${x.cycle==='yearly'?'سنوي':'شهري'} • ${renew}</div><span class="tag ${x.status}">${x.status}</span></div><div class="price">${money(x.price)}</div></div>${full?`<div class="row-actions"><button class="ghost" onclick="openEdit('${x.id}')">تعديل</button><button class="ghost" onclick="togglePause('${x.id}')">${x.status==='paused'?'استئناف':'إيقاف'}</button><button class="danger" onclick="cancelSub('${x.id}')">إلغاء الاشتراك</button></div>`:''}</div>`}
function render(){const active=subs.filter(x=>x.status==='active'),total=active.reduce((a,b)=>a+monthly(b),0);$('heroTotal').textContent=money(total);$('countPill').textContent=active.length+' اشتراك نشط';$('nearPill').textContent=active.filter(x=>days(x.date)>=0&&days(x.date)<=7).length+' تجديد قريب';$('homeList').innerHTML=active.length?active.map(x=>card(x)).join(''):'<div class="empty">لا توجد اشتراكات بعد.</div>';$('m1').textContent=money(total);$('m2').textContent=money(total*12);$('m3').textContent=active.length;$('m4').textContent=subs.length-active.length;$('aiText').textContent=active.length?`لديك ${active.length} اشتراكات نشطة بقيمة شهرية ${money(total)}.`:'أضيفي أول اشتراك لبدء التحليل.';renderSubs();renderPay()}
function renderSubs(){const q=$('search').value.trim().toLowerCase(),list=subs.filter(x=>x.name.toLowerCase().includes(q));$('allList').innerHTML=list.length?list.map(x=>card(x,true)).join(''):'<div class="empty">لا توجد اشتراكات</div>'}
function renderPay(){const list=subs.filter(x=>x.status==='active');$('payList').innerHTML=list.map(x=>`<label class="profile-row"><input type="checkbox" onchange="toggleSel('${x.id}',this.checked)"><span>${esc(x.name)}</span><b>${money(monthly(x))}</b></label>`).join('');const chosen=list.filter(x=>selected.has(x.id));$('payTotal').textContent=money(chosen.reduce((a,b)=>a+monthly(b),0));$('payCount').textContent=chosen.length+' محدد'}
function openAdd(){$('editId').value='';['fName','fPrice','fDate','fPayment','fUrl','fExternalId'].forEach(id=>$(id).value='');$('fProvider').value='';$('fCycle').value='monthly';$('fStatus').value='active';$('fEmail').value=currentUser?.email||'';$('subModal').classList.add('on')}
function openEdit(id){const x=subs.find(s=>s.id===id);if(!x)return;$('editId').value=x.id;$('fName').value=x.name;$('fPrice').value=x.price;$('fDate').value=x.date||'';$('fPayment').value=x.payment||'';$('fUrl').value=x.url||'';$('fProvider').value=x.providerKey||'';$('fExternalId').value=x.externalSubscriptionId||'';$('fEmail').value=x.userEmail||'';$('fCycle').value=x.cycle;$('fStatus').value=x.status;$('subModal').classList.add('on')}
function closeModal(){$('subModal').classList.remove('on')}
function providerChanged(){const k=$('fProvider').value;if(providerUrls[k]&&!$('fUrl').value)$('fUrl').value=providerUrls[k]}
async function saveSub(){const name=$('fName').value.trim(),price=parseFloat($('fPrice').value),date=$('fDate').value;if(!name||!Number.isFinite(price)||!date)return toast('أكملي اسم الخدمة والسعر وتاريخ التجديد');const key=$('fProvider').value.trim(),providerName=({netflix:'Netflix',chatgpt:'ChatGPT',spotify:'Spotify',canva:'Canva',adobe:'Adobe',apple:'Apple',microsoft365:'Microsoft 365',googleone:'Google One'})[key]||name;const payload={user_id:currentUser.id,provider_name:providerName,plan_name:name,amount:price,currency:'SAR',billing_cycle:$('fCycle').value,next_renewal_date:date,status:$('fStatus').value,provider_subscription_ref:$('fExternalId').value.trim()||null,notes:JSON.stringify({payment:$('fPayment').value.trim(),url:$('fUrl').value.trim(),userEmail:$('fEmail').value.trim()})};const editId=$('editId').value.trim();const result=editId?await supabaseClient.from('subscriptions').update(payload).eq('id',editId).eq('user_id',currentUser.id).select():await supabaseClient.from('subscriptions').insert([payload]).select();if(result.error)return alert('Supabase Error:\n\n'+err(result.error));closeModal();await loadSubs();render();toast('تم الحفظ بنجاح')}
async function togglePause(id){const x=subs.find(s=>s.id===id),status=x.status==='paused'?'active':'paused';const{error}=await supabaseClient.from('subscriptions').update({status}).eq('id',id).eq('user_id',currentUser.id);if(error)return alert('Supabase Error:\n\n'+err(error));await loadSubs();render()}
async function cancelSub(id){const x=subs.find(s=>s.id===id);if(!x||!confirm(`هل تريدين بدء إلغاء اشتراك ${x.name}؟`))return;const status=x.url?'action_required':'pending_cancel';const{error}=await supabaseClient.from('subscriptions').update({status,cancellation_method:x.url?'provider_page':'manual'}).eq('id',id).eq('user_id',currentUser.id);if(error)return alert('Supabase Error:\n\n'+err(error));await loadSubs();render();if(x.url)window.open(x.url,'_blank','noopener')}
function toggleSel(id,v){v?selected.add(id):selected.delete(id);renderPay()}
function scanInbox(){toast('سيتم ربط Gmail / Outlook في المرحلة التالية.')}
$('subModal').addEventListener('click',e=>{if(e.target===$('subModal'))closeModal()});
applyLang();init();
</script>
